name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract ZIP File
      run: |
        unzip -o CarromPool_Launcher_AndroidStudio_with_online_build.zip

    - name: Grant Execute Permission for Gradlew
      run: |
        chmod +x ./gradlew || find . -name "gradlew" -exec chmod +x {} +

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
        else
          find . -name "gradlew" -execdir ./gradlew assembleDebug --stacktrace \;
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "**/build/outputs/apk/**/*.apk"
        
